[pytest]
# Pytest configuration for Vesper

pythonpath = .
testpaths = modules tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=modules
    --cov-report=term-missing
    --cov-report=html

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that require AWS resources

# Ignore paths
norecursedirs = .git .terraform build dist *.egg-info
